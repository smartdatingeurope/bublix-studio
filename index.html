<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bublix Studio Online</title><style>body{margin:0;background:#0e1426;color:#f6f8ff;font:15px system-ui}header{padding:16px 22px;background:#19243c;border-bottom:1px solid #34415b}h1{margin:0;font-size:23px}small{color:#aab9d7}.wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 75px)}aside{padding:18px;background:#141e33;display:flex;flex-direction:column;gap:12px}button,.file{background:#4569eb;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer;text-align:center;font:inherit}button:hover,.file:hover{background:#5b7bf4}input[type=file]{display:none}#viewer{min-height:65vh;position:relative}#notice{position:absolute;left:15px;top:15px;background:#15243bbb;padding:9px;border-radius:8px;max-width:70%}img{max-width:100%;border-radius:12px}label{font-weight:600}#status{color:#b9c9e9;line-height:1.5}.note{font-size:13px;color:#b4c1dc}a{color:#a7cbff}@media(max-width:750px){.wrap{grid-template-columns:1fr}#viewer{min-height:55vh}}</style></head><body><header><h1>🎬 Bublix Studio Online</h1><small>3D-персонажи • рисунки • проекты</small></header><div class="wrap"><aside><label>Наш оригинальный Бубликс</label><img src="Bublix_reference.png" alt="Оригинальный рисунок Бубликса"><label class="file">📂 Открыть свою 3D-модель<input id="modelFile" type="file" accept=".glb,.gltf"></label><label class="file">🖼 Загрузить свой рисунок<input id="imageFile" type="file" accept="image/*"></label><button id="reset">🏠 Показать Бубликса</button><button id="snapshot">📸 Сохранить кадр PNG</button><button id="save">💾 Сохранить 3D-модель GLB</button><div id="status">Загружаем Бубликса…</div><p class="note">Модель можно вращать мышью и увеличивать колёсиком. Это рабочий просмотрщик 3D, но не генератор ИИ. Для ИИ и облачного хранения позже потребуется подключение сервисов.</p></aside><main id="viewer"><div id="notice">Перетаскивай мышью, чтобы повернуть персонажа.</div></main></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
const box=document.querySelector('#viewer'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#23395e');const camera=new THREE.PerspectiveCamera(42,1,.01,1000);camera.position.set(0,1.5,5);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;box.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x8498c4,2.4));const light=new THREE.DirectionalLight(0xffffff,2.1);light.position.set(3,5,6);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let current=null,bytes=null,name='Bublix.glb';const loader=new GLTFLoader();function resize(){const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(box);function display(url){loader.load(url,g=>{if(current)scene.remove(current);current=g.scene;scene.add(current);const bounds=new THREE.Box3().setFromObject(current),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());current.position.sub(center);const r=Math.max(size.length()*.9,.5);camera.position.set(r*.4,r*.3,r*1.5);camera.near=Math.max(.001,r/1000);camera.far=r*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();status.textContent='✅ 3D-модель загружена';},undefined,e=>{status.textContent='⚠️ Не удалось загрузить модель. Проверь интернет и файлы. '+e.message})}async function loadDefault(){status.textContent='Загружаем Бубликса…';try{const r=await fetch('Bublix.glb');if(!r.ok)throw Error('Файл модели не найден');bytes=await r.blob();name='Bublix.glb';display(URL.createObjectURL(bytes))}catch(e){status.textContent='⚠️ '+e.message+' — попробуй открыть GLB вручную'}}document.querySelector('#modelFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;bytes=f;name=f.name;display(URL.createObjectURL(f))};document.querySelector('#imageFile').onchange=e=>{const f=e.target.files[0];if(f){document.querySelector('aside img').src=URL.createObjectURL(f);status.textContent='🖼 Рисунок загружен. 3D-модель от этого автоматически не изменяется.'}};document.querySelector('#reset').onclick=loadDefault;document.querySelector('#snapshot').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='Bublix_frame.png';a.click()};document.querySelector('#save').onclick=()=>{if(!bytes){status.textContent='Сначала загрузи 3D-модель';return}const a=document.createElement('a');a.href=URL.createObjectURL(bytes);a.download=name;a.click()};function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}resize();tick();loadDefault();
</script></body></html>
