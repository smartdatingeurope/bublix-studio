
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bublix Studio Online</title>
<style>
body{margin:0;background:#121b35;color:white;font-family:Arial}
header{padding:18px;background:#202b50;font-size:23px;font-weight:bold}
main{display:flex;gap:15px;padding:15px}
aside{width:250px;flex-shrink:0}
aside img{width:100%;border-radius:12px}
button{display:block;width:100%;padding:13px;margin-top:12px;background:#48b9ee;color:white;border:0;border-radius:9px;cursor:pointer}
#viewer{flex:1;height:75vh;min-height:350px;background:#23395e;border-radius:12px;position:relative}
#status{padding:10px;font-size:14px}
@media(max-width:650px){main{flex-direction:column}aside{width:100%}#viewer{height:55vh}}
</style>
</head>
<body>
<header>🎬 Bublix Studio Online</header>
<main>
<aside>
<h3>Наш Бубликс</h3>
<img src="./Bublix_reference.png" alt="Бубликс">
<button id="load">🐻 Показать Бубликса в 3D</button>
<button id="save">📸 Сохранить кадр PNG</button>
<div id="status">Подготовка...</div>
</aside>
<div id="viewer"></div>
</main>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";

const box=document.getElementById("viewer");
const status=document.getElementById("status");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x23395e);

const camera=new THREE.PerspectiveCamera(45,1,0.01,1000);
camera.position.set(0,1,5);

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
box.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777799,3));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,6,5);
scene.add(light);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

let character=null;

function resize(){
const w=box.clientWidth,h=box.clientHeight;
renderer.setSize(w,h);
camera.aspect=w/h;
camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);
resize();

function loadBublix(){
status.textContent="Загружаем Бубликса...";
new GLTFLoader().load(
"./Bublix.glb",
gltf=>{
if(character)scene.remove(character);
character=gltf.scene;
scene.add(character);

const bounds=new THREE.Box3().setFromObject(character);
const center=bounds.getCenter(new THREE.Vector3());
const size=bounds.getSize(new THREE.Vector3());
character.position.sub(center);

const distance=Math.max(size.x,size.y,size.z)*2;
camera.position.set(0,0,distance);
camera.near=Math.max(distance/1000,0.001);
camera.far=Math.max(distance*100,100);
camera.updateProjectionMatrix();
controls.target.set(0,0,0);
controls.update();
status.textContent="Бубликс загружен! Вращай мышкой.";
},
undefined,
err=>{
console.error(err);
status.textContent="Ошибка загрузки GLB. Проверь файл Bublix.glb.";
}
);
}

document.getElementById("load").onclick=loadBublix;
document.getElementById("save").onclick=()=>{
renderer.render(scene,camera);
const a=document.createElement("a");
a.download="Bublix_frame.png";
a.href=renderer.domElement.toDataURL("image/png");
a.click();
};

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();
loadBublix();
</script>
</body>
</html>
